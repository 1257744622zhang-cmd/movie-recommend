spring:
  datasource:
    url: jdbc:h2:mem:movie_recommend;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    database-platform: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true
      path: /h2-console
server:
  port: 8080
  servlet:
    context-path: /

logging:
  level:
    com:
      movie:
        recommend: DEBUG
        user: DEBUG
        movie: DEBUG
    root: INFO
