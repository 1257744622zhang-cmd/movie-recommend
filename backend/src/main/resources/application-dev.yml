# 使用 H2 内存数据库，无需安装 MySQL，便于快速运行
spring:
  datasource:
    url: jdbc:h2:mem:moviedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL;AUTO_SERVER=TRUE;MVCC=TRUE;DEFAULT_ENCODING=UTF-8;CHARACTER_SET=UTF-8;COLLATION=UTF8MB4_UNICODE_CI
    username: sa
    password:
    hikari:
      connection-init-sql: SET NAMES 'UTF8MB4' COLLATE 'UTF8MB4_UNICODE_CI'
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        connection:
          characterEncoding: utf8
          useUnicode: true
  h2:
    console:
      enabled: true
